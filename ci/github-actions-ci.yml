name: ForgeGraph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Type check
        run: mypy apps/api/src/forgegraph
      - name: Unit and API tests
        run: pytest -q --cov=forgegraph --cov-report=term-missing
      - name: Bandit security scan
        run: bandit -r apps/api/src/forgegraph -q
      - name: Dependency audit
        run: pip-audit
